[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-fm"
version = "0.1.0"
description = "Foundation model for personalized recommendation (after the Netflix Tech Blog post)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
